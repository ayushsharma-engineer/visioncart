services:
  postgres:
    image: postgres:16
    container_name: visioncart-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: visioncart
      POSTGRES_USER: visioncart
      POSTGRES_PASSWORD: visioncart_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: